# qp_pipeline configuration reproducing the old NPIPE QuickPol runs

# --- RIMO files (same as in qp_hmap2mat) -----------------------------------
rimo_lfi: /g100_work/INF26_litebird_1/lpagano0/beam_windows_planck/inputs/RIMOs/RIMO_LFI_npipe5_symmetrized.fits
rimo_hfi: /g100_work/INF26_litebird_1/lpagano0/beam_windows_planck/inputs/RIMOs/RIMO_HFI_npipe5v16_symmetrized.fits

# If you have a pre-merged RIMO, you could instead set:
# rimo: /path/to/merged_RIMO.fits

# --- Beam multipoles & output paths ----------------------------------------
blmfile: /g100_work/INF26_litebird_1/lpagano0/beam_windows_planck/inputs/beams/blm_{}.fits

# --- Directory with moments ------------------------------------------------
momentsdir:  /g100_work/INF26_litebird_1/lpagano0/beam_windows_planck/inputs/polmoments

outdir: ../quickpol_output   # where NPZ + FITS will be written
indir: ../quickpol_output    # where NPZs are read from for mat2fits

# --- Physics / algorithm settings ------------------------------------------
smax: 6
nside: null
lmax: null

spin_ref: Pxx
blm_ref: Dxx

mask_file: null
mask_name: null

# Mask configuration examples:
# -----------------------------------------------------------------------------
# 1) One mask for all detector pairs (single string case)
#    If you set one string for mask_file and one for mask_name,
#    the same mask is used for every pair in detpairs.
#
# mask_file: /g100_work/INF26_litebird_1/lpagano0/beam_windows_planck/inputs/masks/mask_galplane_fsky40_ns128.fits
# mask_name: galplane_fsky40
#
# 2) Per-detpair masks
#    You can provide a list aligned with detpairs (same length).
#    Each item can be:
#      - one string: same mask on both map legs of that pair,
#      - two strings: [mask_for_leg1, mask_for_leg2].
#
# mask_file:
#   - /g100_work/INF26_litebird_1/lpagano0/beam_windows_planck/inputs/masks/mask_galplane_fsky20_ns128.fits
#   - /g100_work/INF26_litebird_1/lpagano0/beam_windows_planck/inputs/masks/mask_galplane_fsky40_ns128.fits
#   - [
#       /g100_work/INF26_litebird_1/lpagano0/beam_windows_planck/inputs/masks/mask_galplane_fsky40_ns128.fits,
#       /g100_work/INF26_litebird_1/lpagano0/beam_windows_planck/inputs/masks/mask_galplane_fsky60_ns128.fits,
#     ]
# mask_name:
#   - galplane_fsky20
#   - galplane_fsky40
#   - [galplane_fsky40, galplane_fsky60]
#
# Optional dict style (keyed by detpair) is also supported:
# mask_file:
#   100GHzx100GHz: /path/to/mask_100x100.fits
#   100GHzx143GHz: /path/to/mask_100x143.fits
#   default: /path/to/fallback_mask.fits
# mask_name:
#   100GHzx100GHz: m100x100
#   100GHzx143GHz: m100x143
#   default: mfallback

angle_shift: 0.0
force_det: null              # or e.g. "143-1a" if you want to force a label

release: npipe6v20
rhobeam: IMO
rhohit: IMO

# Pixel undersampling:
#   null  -> full pixels (no undersampling; old test: false)
#   64    -> sparse sampling like old test: true. 64 means nide 2048-> 256
pixel_undersampling: null

# Legacy option (now ignored unless pixel_undersampling is unset):
# test: false

planet: ""                   # or "Saturn" if you actually want planet deconv
conserve_memory: false
overwrite: false             # overwrite existing NPZ + FITS?

# --- FITS / window function outputs ----------------------------------------
blfile: true                 # scalar Bl(T)
blTEBfile: true              # Bl(TEB)
wlfile: true                 # Wl matrices

# --- Detector / detset pairs -----------------------------------------------
# This MUST match the old __main__ loops if you want identical coverage.
# The full list is long, so you should generate it with the small helper
# script below and paste it here.
detpairs:
  # EXAMPLES / PLACEHOLDERS ─ replace with full list from helper script
  - [100GHz, 100GHz]
  - [100GHz, 143GHz]
  - [143GHz, 143GHz]
  - [143A, 143A]
  - [143A, 143B]
  # ...
  # full list should include:
  #  * all auto/cross among {100, 143, 217, 353} with suffixes Ghz, A, B
  #    (excluding full-frequency vs A/B mismatches as in the original code)
  #  * all (det, det) for det in list_planck("Planck")
  #  * all single-horn pairs (horn, horn) where horn is det[:-1] for det[-1] in {a, M}